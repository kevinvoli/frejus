# Sert le build statique du site vitrine (React + Vite, sans routeur client).
# Derrière le Nginx de l'hôte (voir deploy/infrastructure/nginx/).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets Vite hashés (immutables) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
