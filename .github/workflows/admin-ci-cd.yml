name: Admin CI/CD

# Pipeline dédié au panneau admin (dossier admin/), indépendant des workflows du
# site vitrine (GitHub Pages) et du backend (backend-ci-cd.yml).
#
# Secrets GitHub à configurer avant que le job "deploy" fonctionne
# (Settings > Secrets and variables > Actions) :
#   VPS_HOST          adresse IP ou nom d'hôte du VPS (partagé avec le backend)
#   VPS_USERNAME      utilisateur SSH de déploiement
#   VPS_SSH_KEY       clé privée SSH correspondante (sans passphrase)
#   VPS_PORT          port SSH (22 par défaut si absent)
#   VPS_DEPLOY_PATH   dossier sur le VPS contenant docker-compose.prod.yml et le .env
#   ADMIN_VITE_API_URL  URL publique de l'API utilisée par le panneau admin, ex :
#                        https://api.pixellia.example.com/api
#                        Gravée en dur dans le build (Vite), donc nécessaire ici en
#                        secret de build et non seulement dans le .env du VPS.
#
# Tant que ces secrets ne sont pas renseignés, seuls les jobs "test" et
# "build-and-push" s'exécutent utilement ; le job "deploy" échouera faute de cible.

on:
  push:
    branches:
      - master
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci-cd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/frejus-admin

jobs:
  test:
    name: Build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # VITE_API_URL n'a pas besoin d'être correcte ici : ce build ne sert qu'à
        # vérifier la compilation, l'image publiée est reconstruite avec la vraie
        # valeur dans le job build-and-push ci-dessous.
        env:
          VITE_API_URL: http://localhost:3000/api
        run: npm run build

  build-and-push:
    name: Build & push image Docker
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: admin
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.ADMIN_VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Déploiement sur le VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            export ADMIN_IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull admin
            docker compose -f docker-compose.prod.yml up -d admin
            docker image prune -f
