name: Admin CI/CD

# Pipeline du panneau admin (dossier admin/).
#   test -> build-and-push (GHCR) -> deploy (SSH vers le VPS, service "admin")
#
# Secrets de build supplémentaires (gravés en dur dans le bundle par Vite : les
# changer impose de relancer ce pipeline, éditer le .env du VPS ne suffit pas) :
#   ADMIN_VITE_API_URL       URL publique de l'API,          ex : https://api.exemple.fr/api
#   ADMIN_VITE_FRONTEND_URL  URL publique du site vitrine,   ex : https://exemple.fr
#                            (sert à construire le lien de galerie partagé au client)
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   VPS_HOST      adresse IP ou nom d'hôte du VPS
#   VPS_USER      utilisateur SSH de déploiement
#   VPS_SSH_KEY   clé privée SSH correspondante (sans passphrase)
#
# Secrets facultatifs :
#   VPS_PORT      port SSH                        (défaut : 22)
#   VPS_APP_PATH  dossier applicatif sur le VPS   (défaut : /opt/apps/frejus)
#   GHCR_USERNAME / GHCR_TOKEN   seulement si les packages GHCR restent privés

on:
  push:
    branches:
      - master
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci-cd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/frejus-admin

jobs:
  test:
    name: Build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Valeurs sans importance ici : ce job ne vérifie que la compilation, l'image
        # publiée est reconstruite avec les vraies URL dans le job build-and-push.
        env:
          VITE_API_URL: http://localhost:3000/api
          VITE_FRONTEND_URL: http://localhost:5173
        run: npm run build

  build-and-push:
    name: Build & push image Docker
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: admin
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.ADMIN_VITE_API_URL || vars.ADMIN_VITE_API_URL || 'http://localhost:3000/api' }}
            VITE_FRONTEND_URL=${{ secrets.ADMIN_VITE_FRONTEND_URL || vars.ADMIN_VITE_FRONTEND_URL || 'http://localhost:5173' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Déploiement sur le VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Le contexte `secrets` n'est pas accessible dans un `if:` de job : la
      # vérification se fait donc ici et conditionne le step suivant, pour que le
      # pipeline reste vert tant que le VPS n'est pas prêt.
      - name: Vérifier la configuration du VPS
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret VPS_HOST absent : déploiement ignoré. L'image reste publiée sur GHCR."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déployer via SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || vars.VPS_PORT || 22 }}
          envs: APP_PATH,IMAGE_NAME,GIT_SHA,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e
            if [ ! -d "$APP_PATH" ]; then
              echo "ERREUR : ${APP_PATH} absent sur le VPS." >&2
              echo "Lancer d'abord vps-bootstrap.sh puis copier deploy/ (voir docs/DEPLOIEMENT-VPS.md)." >&2
              exit 1
            fi
            cd "$APP_PATH"
            chmod +x deploy.sh
            ./deploy.sh admin "${IMAGE_NAME}:${GIT_SHA}"
        env:
          APP_PATH: ${{ secrets.VPS_APP_PATH || vars.VPS_APP_PATH || '/opt/apps/frejus' }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GIT_SHA: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
