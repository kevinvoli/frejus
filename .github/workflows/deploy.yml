name: Build and deploy

# Secret GitHub à configurer pour que le site déployé appelle la bonne API en
# production (Settings > Secrets and variables > Actions) :
#   FRONTEND_VITE_API_URL   URL publique de l'API backend, ex :
#                           https://api.pixellia.example.com/api
#                           Gravée en dur dans le build (Vite), comme pour l'admin
#                           (voir admin-ci-cd.yml) : changer l'URL nécessite un nouveau
#                           déploiement, pas juste une modification côté VPS.
# Tant que ce secret n'est pas renseigné, le build utilise http://localhost:3000/api
# par défaut (voir frontend/.env.example) — le site se déploie mais n'affichera que
# le contenu de repli codé en dur tant que l'API n'est pas jointe.

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.FRONTEND_VITE_API_URL }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
