name: Backend CI/CD

# Pipeline dédié au backend NestJS (dossier backend/), indépendant du workflow
# "Build and deploy" existant qui publie le site vitrine statique sur GitHub Pages.
#
# Secrets GitHub à configurer avant que le job "deploy" fonctionne
# (Settings > Secrets and variables > Actions) :
#   VPS_HOST        adresse IP ou nom d'hôte du VPS
#   VPS_USERNAME     utilisateur SSH de déploiement
#   VPS_SSH_KEY      clé privée SSH correspondante (sans passphrase)
#   VPS_PORT         port SSH (22 par défaut si absent)
#   VPS_DEPLOY_PATH  dossier sur le VPS contenant docker-compose.prod.yml et le .env
#
# Tant que ces secrets ne sont pas renseignés, seuls les jobs "test" et
# "build-and-push" s'exécutent utilement ; le job "deploy" échouera faute de cible.

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/frejus-backend

jobs:
  test:
    name: Build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

  build-and-push:
    name: Build & push image Docker
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Déploiement sur le VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            export BACKEND_IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
