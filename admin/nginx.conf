# Sert le build statique du panneau admin (SPA React Router).
# noindex: ce panneau n'a rien à faire dans les moteurs de recherche.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Fallback SPA : toute route inconnue du serveur (ex: /portfolio, /settings)
    # doit renvoyer index.html pour laisser react-router-dom gérer le routage côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets Vite hashés (immutables) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
