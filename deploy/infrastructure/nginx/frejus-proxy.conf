# En-têtes communs à tous les proxy_pass du projet frejus.
# Installé dans /etc/nginx/snippets/frejus-proxy.conf par nginx-apply.sh (même dossier).
#
# Pas de directives Upgrade/Connection : aucun service du projet n'utilise de
# WebSocket. Les ajouter reviendrait à envoyer "Connection: upgrade" sur toutes les
# requêtes HTTP ordinaires.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
