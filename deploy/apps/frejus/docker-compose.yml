# Stack applicative frejus — déployée dans /opt/apps/frejus sur le VPS.
#
# Aucun port n'est exposé sur Internet : les trois services sont publiés sur
# 127.0.0.1 uniquement, et Nginx — installé et configuré à la main sur l'hôte — est
# le seul point d'entrée public en 80/443.
#
#   Internet ──▶ Nginx ──┬─▶ 127.0.0.1:3000  web    (site vitrine)
#                        ├─▶ 127.0.0.1:4000  api    (NestJS)
#                        └─▶ 127.0.0.1:3001  admin  (panneau)
#
# MySQL n'est PAS dans ce fichier et n'est jamais touché par le déploiement : la base
# est administrée à la main, hors de ce dépôt. L'API la joint via DB_HOST / DB_PORT du
# .env, et via le réseau Docker nommé par DB_NETWORK — voir .env.example.
#
# Le réseau "frejus" est externe et créé par le pipeline au premier déploiement :
#   docker network create frejus

name: frejus

services:
  web:
    image: ${FRONTEND_IMAGE:-ghcr.io/kevinvoli/frejus-frontend:latest}
    container_name: frejus-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:80'
    networks:
      - frejus
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    image: ${BACKEND_IMAGE:-ghcr.io/kevinvoli/frejus-backend:latest}
    container_name: frejus-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Le conteneur écoute sur 3000 (défaut de l'app, identique au dev local) ;
      # c'est la publication ci-dessous qui expose l'API sur le 4000 de l'hôte.
      PORT: 3000
    ports:
      - '127.0.0.1:4000:3000'
    volumes:
      # Images uploadées (portfolio, spécialités, galeries) — bind mount pour que
      # les sauvegardes se fassent simplement depuis l'hôte.
      - ./data/uploads:/app/uploads
    networks:
      - frejus
      - database
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/kevinvoli/frejus-admin:latest}
    container_name: frejus-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:3001:80'
    networks:
      - frejus
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  # Réseau privé des trois services du projet.
  frejus:
    external: true

  # Réseau par lequel l'API joint la base de données. Externe et nommé depuis le .env :
  # il appartient à l'administrateur de MySQL, pas à ce fichier. Voir .env.example pour
  # le couple DB_NETWORK / DB_HOST selon la façon dont la base est hébergée.
  database:
    external: true
    name: ${DB_NETWORK:-bridge}
